# Dependabot: týdně navrhne nové verze akcí a balíčků jako PR do větve beta (main zůstává jen pro vydání přes PR beta → main).
# Hlavní verze (Firebase Admin, Functions) se nesluči samy: vždy samostatná verze s testem notifikací.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/functions"
    target-branch: "beta"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
