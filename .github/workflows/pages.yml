# Nasazení HockeyCoach na GitHub Pages: větev main = stabilní verze (kořen webu), větev beta = 🧪 beta (složka beta/).
# Spustí se po každém nahrání do main nebo beta (i ručně v záložce Actions → Run workflow) a pokaždé postaví web z obou větví.
# Nastavení repozitáře (jednou): Settings → Pages → Source: GitHub Actions; Settings → Environments → github-pages →
# Deployment branches and tags: přidat větev beta (jinak nasazení z bety odmítne). Postup je v README (Nasazení nové verze).
# Od v22.18.2 se před nasazením spustí testy nahrané větve (npm test + kouřový test všech rolí) – při chybě se nic nenasadí.

name: Nasazení (stabilní + beta)

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

# Základ jen čtení; zápis do Pages a id-token dostane až job nasazení (testy je nepotřebují)
permissions:
  contents: read

# Nasazení jedno po druhém (rychle po sobě nahraná main a beta se nepřepíšou napůl)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ===== Testy nahrané větve (main nebo beta) =====
  # Stejné ověření jako před commitem (docs/KONVENCE.md kap. 0): npm test zelený, kouřový test všech rolí bez chyb.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Akce jsou připnuté na celý commit (SHA) – komentář říká hlavní verzi; novou verzi navrhne Dependabot
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Testy (npm test)
        run: npm test
      - name: Kouřový test (všechny role)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run smoke

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ===== Stažení obou větví =====
      - name: Stabilní (main)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: main
          path: main
      - name: Beta (větev beta, když existuje)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
        with:
          persist-credentials: false
          ref: beta
          path: beta

      # ===== Složení webu =====
      # Do webu nejde .git, .github, testy ani node_modules. Beta dostane vlastní název ikony a barvu (manifest), aby šla
      # nainstalovat jako druhá aplikace „HockeyCoach β“ vedle stabilní.
      - name: Složit web
        run: |
          set -e
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'node_modules' main/ _site/
          if [ -f beta/index.html ]; then
            mkdir -p _site/beta
            rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'node_modules' beta/ _site/beta/
            jq '.name = "HockeyCoach β" | .short_name = "HC β" | .theme_color = "#8e44ad"' beta/manifest.webmanifest > _site/beta/manifest.webmanifest
            echo "Beta: $(grep -o 'APP_VERSION = "[^"]*"' beta/src/core/app-version.js)"
          else
            echo "Větev beta zatím není – nasazuje se jen stabilní verze."
          fi
          echo "Stabilní: $(grep -o 'APP_VERSION = "[^"]*"' main/src/core/app-version.js)"
          touch _site/.nojekyll

      # ===== Nasazení =====
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
